name: Windows CUDA MoE-cache Release
on:
  workflow_dispatch:
  push:
    branches:
      - llama/main
    paths:
      - .github/workflows/windows-cuda-moe-cache.yml
permissions:
  contents: read
jobs:
  build:
    name: Build llama.cpp Windows CUDA Release
    runs-on: windows-2025
    env:
      SOURCE_REPOSITORY: Protonburn35/llama.cpp
      SOURCE_BRANCH: moe-cache
      SOURCE_SHA: a461dd9c5db5628295ac65481c6b41c8cb45c210
      CUDA_ARCHS: 89;120
    steps:
      - name: Check out the exact moe-cache commit
        uses: actions/checkout@v4
        with:
          repository: Protonburn35/llama.cpp
          ref: a461dd9c5db5628295ac65481c6b41c8cb45c210
          fetch-depth: 0
      - name: Record the exact source commit
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Checked out $actual but expected $env:SOURCE_SHA"
          }
          "BUILT_COMMIT=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building $env:SOURCE_REPOSITORY/$env:SOURCE_BRANCH at $actual"
      - name: Select the installed MSVC toolchain
        shell: pwsh
        run: |
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'vswhere.exe was not found on the Windows runner'
          }
          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsPath) {
            throw 'No MSVC x64 toolchain was found on the Windows runner'
          }
          $cl = Get-ChildItem (Join-Path $vsPath 'VC/Tools/MSVC') -Recurse -Filter cl.exe |
            Where-Object { $_.FullName -like '*\Hostx64\x64\cl.exe' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $cl) {
            throw "No Hostx64/x64 cl.exe found below $vsPath"
          }
          "VS_INSTALLATION_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CL_EXE=$($cl.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $vsVersion = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property catalog_productDisplayVersion).Trim()
          "MSVC_VERSION=$vsVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using Visual Studio $vsVersion at $vsPath"
          Write-Host "Using compiler $($cl.FullName)"
      - name: Install CUDA Toolkit 13.2.0
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
          method: network
      - name: Verify CUDA can compile sm_89 and sm_120
        shell: pwsh
        run: |
          $nvcc = Join-Path $env:CUDA_PATH 'bin/nvcc.exe'
          if (-not (Test-Path $nvcc)) {
            throw "nvcc was not found at $nvcc"
          }
          & $nvcc --version
          $probeCu = Join-Path $env:RUNNER_TEMP 'cuda_arch_probe.cu'
          $probeObj = Join-Path $env:RUNNER_TEMP 'cuda_arch_probe.obj'
          'extern "C" __global__ void cuda_arch_probe() {}' | Set-Content -Path $probeCu -Encoding ascii
          & $nvcc -ccbin $env:CL_EXE '-gencode=arch=compute_89,code=sm_89' '-gencode=arch=compute_120,code=sm_120' -c $probeCu -o $probeObj
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $probeObj)) {
            throw 'CUDA Toolkit verification failed for sm_89 and/or sm_120'
          }
          "CUDA_ARCH_PROBE=PASS (sm_89, sm_120)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'CUDA Toolkit verified: sm_89 and sm_120 both compile.'
      - name: Configure Release CUDA build with CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 18 2026' -A x64 -DCMAKE_GENERATOR_INSTANCE="$env:VS_INSTALLATION_PATH" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES="$env:CUDA_ARCHS" -DGGML_CUDA=ON -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_TOOLS=ON
          if ($LASTEXITCODE -ne 0) {
            throw 'CMake configuration failed'
          }
      - name: Build llama-server Release target
        shell: pwsh
        run: |
          cmake --build build --config Release --target llama-server --parallel
          if ($LASTEXITCODE -ne 0) {
            throw 'Release llama-server build failed'
          }
      - name: Assemble runnable Windows package and verify MoE-cache flags
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE 'package'
          if (Test-Path $package) {
            Remove-Item $package -Recurse -Force
          }
          New-Item -ItemType Directory -Path $package | Out-Null
          $releaseFiles = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'build') -Recurse -File |
            Where-Object { $_.Extension -in @('.dll', '.exe', '.pdb') -and $_.FullName -like '*\Release\*' }
          foreach ($file in $releaseFiles) {
            Copy-Item -LiteralPath $file.FullName -Destination $package -Force
          }
          $cudaBin = Join-Path $env:CUDA_PATH 'bin'
          $cudaRuntime = Get-ChildItem -Path $cudaBin -File -Filter '*.dll'
          foreach ($dll in $cudaRuntime) {
            Copy-Item -LiteralPath $dll.FullName -Destination $package -Force
          }
          $crt = Get-ChildItem -Path (Join-Path $env:VS_INSTALLATION_PATH 'VC/Redist/MSVC') -Recurse -File -Filter '*.dll' |
            Where-Object { $_.FullName -like '*\x64\Microsoft.VC*.CRT\*' }
          foreach ($dll in $crt) {
            Copy-Item -LiteralPath $dll.FullName -Destination $package -Force
          }
          $server = Get-Item (Join-Path $package 'llama-server.exe') -ErrorAction SilentlyContinue
          if (-not $server) {
            throw 'Flattened llama-server.exe was not produced'
          }
          Write-Host "Testing server executable: $($server.FullName)"
          $bytes = [System.IO.File]::ReadAllBytes($server.FullName)
          $binaryText = [System.Text.Encoding]::ASCII.GetString($bytes)
          $moeLines = [regex]::Matches($binaryText, '--moe-[A-Za-z0-9-]+') |
            ForEach-Object { $_.Value } |
            Sort-Object -Unique
          $moeLines | Set-Content -Path (Join-Path $package 'moe-cache-flags.txt') -Encoding utf8
          $requiredFlags = @('--moe-expert-cache-size', '--moe-expert-cache-host-pinned-mb')
          $missingFlags = @($requiredFlags | Where-Object { -not $binaryText.Contains($_) })
          if ($missingFlags.Count -gt 0) {
            Write-Host "Missing MoE-cache flags in llama-server.exe: $($missingFlags -join ', ')"
            throw 'Required MoE-cache flag missing from llama-server.exe static scan'
          }
          Write-Host 'MoE-cache CLI flags found in llama-server.exe:'
          $moeLines | ForEach-Object { Write-Host $_ }
          'Static executable verification passed. Runtime launch is not attempted on the standard runner because it may not have the NVIDIA display-driver DLL.' | Set-Content -Path (Join-Path $package 'llama-server-help.txt') -Encoding utf8
          $cudaVersion = (& (Join-Path $env:CUDA_PATH 'bin/nvcc.exe') --version | Select-String 'release').Line.Trim()
          $runnerVersion = "$env:ImageOS $env:ImageVersion"
          @"
          Repository: $env:SOURCE_REPOSITORY
          Source branch: $env:SOURCE_BRANCH
          Source commit: $env:BUILT_COMMIT
          Runner OS: $runnerVersion
          MSVC: $env:MSVC_VERSION
          CUDA Toolkit: $cudaVersion
          CMake generator: Visual Studio 18 2026
          CMake architecture: x64
          CMake configuration: Release
          GGML_CUDA: ON
          BUILD_SHARED_LIBS: OFF
          CMAKE_CUDA_ARCHITECTURES: $env:CUDA_ARCHS
          CUDA architecture probe: $env:CUDA_ARCH_PROBE
          Build target: llama-server
          Required MoE-cache flags: present (static executable scan)
          "@ | Set-Content -Path (Join-Path $package 'BUILD-METADATA.txt') -Encoding utf8
      - name: Create the ZIP artifact
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "llama.cpp-windows-cuda-moe-cache-$env:BUILT_COMMIT.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'package/*') -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) {
            throw 'ZIP creation failed'
          }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          Write-Host "ZIP: $zip"
          Write-Host "SHA256: $hash"
      - name: Upload the complete Windows Release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-windows-cuda-moe-cache-a461dd9c5db5628295ac65481c6b41c8cb45c210
          path: llama.cpp-windows-cuda-moe-cache-a461dd9c5db5628295ac65481c6b41c8cb45c210.zip
          if-no-files-found: error
          retention-days: 14
